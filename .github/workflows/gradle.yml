name: Build Dynamic Island APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        id: project
        shell: bash
        run: |
          echo "Repository root:"
          ls -la

          SETTINGS_FILE=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No Gradle settings file found. Check that the Android project files are uploaded and extracted."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Found project in: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle wrapper not found; trying installed Gradle."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-island-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
